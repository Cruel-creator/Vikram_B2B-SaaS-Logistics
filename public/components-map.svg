<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">VC Pipeline Intelligence — Components Map</title>
  <desc id="d">Vercel Cron and the Run-now button trigger chunked serverless functions. Ingest pulls live evidence from Google News RSS, GDELT, blog RSS, Firecrawl (fallback) and optionally LinkedIn via Apify; Gemini Flash classifies it into the signals table. Score computes a deterministic follow-up score, Gemini Flash drafts the next move, and only the four signal columns of vcs are written via the update_vc_signals RPC. The dashboard reads Supabase server-side; Vikram edits manual columns in Supabase.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#696969"/>
    </marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#B84A12"/>
    </marker>
    <radialGradient id="glow" cx="20%" cy="0%" r="70%">
      <stop offset="0" stop-color="#B84A12" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#B84A12" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font:500 14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#141413}
      .tl{font:500 14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#B84A12}
      .s{font:12px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#696969}
      .m{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#696969}
      .ml{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#B84A12}
      .k{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#8E8880}
      .kg{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;fill:#1F7A52}
      .box{fill:#FFFFFF;stroke:rgba(20,20,19,.14)}
      .ai{fill:#FFF3EC;stroke:#B84A12;stroke-opacity:.55}
      .cron{fill:#FFF6E6;stroke:#D9930D;stroke-opacity:.5}
      .ln{fill:none;stroke:#696969;stroke-width:1.3}
      .lnl{fill:none;stroke:#B84A12;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#FCFBFA"/>
  <rect width="1200" height="720" fill="url(#glow)"/>

  <text x="30" y="34" class="k">COMPONENTS MAP · VC PIPELINE INTELLIGENCE</text>

  <!-- Triggers -->
  <rect x="30" y="56" width="230" height="46" rx="23" class="box"/>
  <text x="50" y="84" class="t">▶ Run now</text><text x="130" y="84" class="m">POST /api/run</text>
  <rect x="300" y="56" width="260" height="46" rx="23" class="cron"/>
  <text x="320" y="77" class="t">Vercel Cron · ingest</text><text x="320" y="93" class="m">daily 06:00 IST</text>
  <rect x="640" y="56" width="260" height="46" rx="23" class="cron"/>
  <text x="660" y="77" class="t">Vercel Cron · score</text><text x="660" y="93" class="m">Mon &amp; Thu 07:00 IST</text>
  <path d="M430 102 V146" class="ln" marker-end="url(#a)"/>
  <path d="M770 102 V146" class="ln" marker-end="url(#a)"/>
  <path d="M260 79 C285 79 285 120 330 146" class="ln" marker-end="url(#a)"/>
  <text x="940" y="76" class="m">cron: Bearer CRON_SECRET</text>
  <text x="940" y="92" class="m">Run now: Bearer ADMIN_TOKEN</text>

  <!-- Sources -->
  <text x="30" y="140" class="k">LIVE SOURCES</text>
  <rect x="30" y="150" width="230" height="58" rx="12" class="box"/>
  <text x="46" y="174" class="t">Google News RSS</text><text x="46" y="194" class="s">person + firm-investment queries</text>
  <rect x="30" y="220" width="230" height="58" rx="12" class="box"/>
  <text x="46" y="244" class="t">GDELT DOC 2.0</text><text x="46" y="264" class="s">60-day window · ≤1 req / 5 s</text>
  <rect x="30" y="290" width="230" height="58" rx="12" class="box"/>
  <text x="46" y="314" class="t">Blog · Substack · Medium RSS</text><text x="46" y="334" class="s">vcs.blog_rss · item pubDate</text>
  <rect x="30" y="360" width="230" height="58" rx="12" class="box"/>
  <text x="46" y="384" class="t">Firecrawl /search</text><text x="46" y="404" class="s">only if no active signal · 72h cache</text>
  <rect x="30" y="430" width="230" height="58" rx="12" class="box" stroke-dasharray="5 4"/>
  <text x="46" y="454" class="t">LinkedIn via Apify</text><text x="46" y="474" class="s">optional · OFF unless APIFY_TOKEN</text>

  <path d="M260 179 C282 179 280 205 298 205" class="ln" marker-end="url(#a)"/>
  <path d="M260 249 C282 249 280 212 298 212" class="ln"/>
  <path d="M260 319 C284 319 282 220 298 220" class="ln"/>
  <path d="M260 389 C286 389 284 228 298 228" class="ln"/>
  <path d="M260 459 C288 459 286 236 298 236" class="ln" stroke-dasharray="4 4"/>

  <!-- Ingest -->
  <rect x="300" y="150" width="260" height="110" rx="14" class="box"/>
  <text x="318" y="176" class="t">/api/cron/ingest</text>
  <text x="318" y="198" class="s">5-VC chunks · hands off every ~3 min</text>
  <text x="318" y="216" class="s">needs real URL + published date</text>
  <text x="318" y="234" class="s">dedupe (vc_id, md5(url)) · 300 s max</text>

  <!-- Gemini classify -->
  <rect x="300" y="300" width="260" height="86" rx="14" class="ai"/>
  <text x="318" y="326" class="tl">Gemini Flash · classify</text>
  <text x="318" y="347" class="s">batches of 8 · JSON schema · summary</text>
  <text x="318" y="365" class="m">is_about_vc · type · relevance</text>
  <path d="M430 262 V298" class="lnl" marker-end="url(#al)" marker-start="url(#al)"/>

  <!-- Score -->
  <rect x="640" y="150" width="260" height="110" rx="14" class="box"/>
  <text x="658" y="176" class="t">/api/cron/score</text>
  <text x="658" y="198" class="s">scoring.ts — deterministic, no AI</text>
  <text x="658" y="216" class="m">relevance × weight × recency</text>
  <text x="658" y="234" class="s">+ momentum · status rules → bucket</text>

  <!-- Gemini action -->
  <rect x="640" y="300" width="260" height="86" rx="14" class="ai"/>
  <text x="658" y="326" class="tl">Gemini Flash · next move</text>
  <text x="658" y="347" class="s">≤30 words, cites top signal</text>
  <text x="658" y="365" class="s">template fallback if Gemini fails</text>
  <path d="M770 262 V298" class="lnl" marker-end="url(#al)" marker-start="url(#al)"/>

  <!-- Supabase band -->
  <rect x="280" y="520" width="650" height="176" rx="18" fill="#F1F6F3" stroke="#1F7A52" stroke-opacity=".35" stroke-dasharray="6 5"/>
  <text x="300" y="545" class="kg">SUPABASE · POSTGRES · RLS ON · COLUMN GRANTS</text>

  <rect x="300" y="560" width="150" height="116" rx="12" class="box"/>
  <text x="316" y="586" class="t">signals</text>
  <text x="316" y="606" class="s">raw evidence</text>
  <text x="316" y="623" class="s">never deleted</text>
  <text x="316" y="650" class="m">unique(vc_id,</text>
  <text x="316" y="664" class="m">  url_hash)</text>

  <rect x="465" y="560" width="135" height="52" rx="12" class="box"/>
  <text x="480" y="582" class="t">search_cache</text><text x="480" y="600" class="m">Firecrawl 72h</text>
  <rect x="465" y="624" width="135" height="52" rx="12" class="box"/>
  <text x="480" y="646" class="t">runs</text><text x="480" y="664" class="m">audit + fingerprint</text>

  <rect x="615" y="560" width="295" height="116" rx="12" class="box" stroke="#B84A12" stroke-opacity=".35"/>
  <text x="631" y="586" class="t">vcs</text>
  <text x="668" y="586" class="m">service_role UPDATE only on ↓</text>
  <text x="631" y="608" class="ml">last_signal_date · signal_summary</text>
  <text x="631" y="626" class="ml">follow_up_score · recommended_action</text>
  <text x="631" y="650" class="s">manual cols (status, notes, history)</text>
  <text x="631" y="666" class="s">→ permission denied for the pipeline</text>

  <!-- flows into DB -->
  <path d="M375 386 V556" class="ln" marker-end="url(#a)"/>
  <text x="383" y="470" class="m">classified rows</text>
  <path d="M445 557 C 470 500, 600 520, 600 400 L 600 250 C 600 225, 612 215, 636 215" class="ln" marker-end="url(#a)"/>
  <text x="614" y="390" class="m" transform="rotate(-90 614 390)">60-day signals</text>
  <path d="M770 386 V556" class="lnl" marker-end="url(#al)"/>
  <text x="778" y="460" class="ml">RPC update_vc_signals()</text>
  <text x="778" y="476" class="m">4 columns only</text>
  <text x="778" y="492" class="m">fingerprint check ✓</text>

  <!-- Outputs -->
  <rect x="960" y="150" width="210" height="122" rx="14" class="box" stroke="#B84A12" stroke-opacity=".3"/>
  <text x="978" y="176" class="t">Dashboard</text>
  <text x="978" y="197" class="s">Next.js 15 on Vercel</text>
  <text x="978" y="215" class="m">/  ·  /runs</text>
  <text x="978" y="236" class="s">Reach out · Warm · Quiet</text>
  <text x="978" y="254" class="s">notes editable (admin token)</text>
  <path d="M928 540 C 945 430, 938 330, 957 262" class="ln" marker-end="url(#a)"/>

  <!-- Outreach -->
  <rect x="960" y="296" width="210" height="150" rx="14" class="box" stroke="#3860BE" stroke-opacity=".45"/>
  <text x="978" y="322" class="t">Outreach panel</text>
  <text x="978" y="343" class="s">contacts: firm site, exact match</text>
  <text x="978" y="361" class="s">Gemini draft + anti-slop lint</text>
  <text x="978" y="379" class="s">pdf-lib deck, cover per firm</text>
  <text x="978" y="397" class="s">preview → Open in Gmail</text>
  <text x="978" y="415" class="s">LinkedIn note: copy + open</text>
  <text x="978" y="433" class="m">tables: contacts · firm_brands</text>

  <rect x="960" y="560" width="210" height="116" rx="14" class="box"/>
  <text x="978" y="586" class="t">Vikram</text>
  <text x="978" y="607" class="s">edits notes, status, last</text>
  <text x="978" y="624" class="s">contact in the app (RPC</text>
  <text x="978" y="641" class="s">update_vc_manual) or Supabase</text>
  <path d="M958 618 H914" class="ln" marker-end="url(#a)"/>
</svg>
